apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
      - name: nodejs-container
        image: swatikadam16/nodejs-k8s-app:v1

        ports:
        - containerPort: 3001